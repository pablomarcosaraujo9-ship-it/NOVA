<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #eee;
    font-family: -apple-system, sans-serif;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  #topo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  #ticker-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1em;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #eee;
  }
  #btn-buscar {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #8b949e;
    font-size: 1.1em;
    cursor: pointer;
  }
  #link-ranking {
    text-align: right;
    font-size: 0.85em;
    color: #58a6ff;
    margin-bottom: 12px;
    cursor: pointer;
  }

  #card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 18px;
    display: none;
  }
  #card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  #card-ticker {
    font-size: 1.3em;
    font-weight: 700;
  }
  #card-preco {
    font-size: 1.5em;
    font-weight: 700;
    text-align: right;
  }
  #card-variacao {
    text-align: right;
    font-size: 0.95em;
    margin-top: 2px;
  }
  .up { color: #3fb950; }
  .down { color: #f85149; }

  #chart-wrapper {
    position: relative;
    margin-top: 14px;
  }
  #chart-container {
    width: 100%;
    height: 280px;
    touch-action: none;
  }

  /* Balão que "anda em cima" da linha, seguindo o dedo */
  #tooltip {
    position: absolute;
    display: none;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78em;
    color: #eee;
    pointer-events: none;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    z-index: 10;
  }
  #tooltip .preco {
    font-weight: 700;
    color: #58a6ff;
  }
  #tooltip .data {
    color: #8b949e;
  }

  #grafico-periodos {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  #grafico-periodos button {
    flex: 1;
    padding: 8px 0;
    font-size: 0.85em;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #8b949e;
    cursor: pointer;
  }
  #grafico-periodos button.ativo {
    background: #1e88e5;
    color: white;
    border-color: #1e88e5;
  }
  #grafico-periodos button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  #status-live {
    font-size: 0.75em;
    color: #6e7681;
    text-align: center;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #status-live.ativo {
    color: #3fb950;
  }

  #aviso {
    font-size: 0.78em;
    color: #6e7681;
    margin-top: 6px;
    text-align: center;
  }

  #mensagem {
    text-align: center;
    color: #6e7681;
    padding: 40px 0;
  }

  #ranking-panel {
    display: none;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 18px;
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 0.9em;
  }
  #voltar-grafico {
    color: #58a6ff;
    cursor: pointer;
    font-size: 0.85em;
    margin-bottom: 10px;
    display: inline-block;
  }
</style>
</head>
<body>

<div id="topo">
  <input id="ticker-input" type="text" placeholder="Digite um ticker (ex: PETR4.SA)" value="PETR4.SA">
  <button id="btn-buscar" onclick="verGrafico()">🔍</button>
</div>

<div id="link-ranking" onclick="abrirRanking()">📊 Ranking do dia</div>

<div id="mensagem">Digite um ticker e busque para ver o gráfico.</div>

<div id="card">
  <div id="card-header">
    <div id="card-ticker"></div>
    <div>
      <div id="card-preco"></div>
      <div id="card-variacao"></div>
    </div>
  </div>

  <div id="chart-wrapper">
    <div id="chart-container"></div>
    <div id="tooltip">
      <div class="preco"></div>
      <div class="data"></div>
    </div>
  </div>

  <div id="grafico-periodos">
    <button disabled title="Em breve (precisa de dado intraday)">1D</button>
    <button onclick="trocarPeriodo('5d')" id="btn-5d">5D</button>
    <button class="ativo" onclick="trocarPeriodo('1mo')" id="btn-1mo">1M</button>
    <button onclick="trocarPeriodo('6mo')" id="btn-6mo">6M</button>
    <button onclick="trocarPeriodo('1a')" id="btn-1a">1A</button>
    <button onclick="trocarPeriodo('5a')" id="btn-5a">5A</button>
  </div>

  <div id="status-live">🕐 <span id="contador">atualiza em 60s</span></div>
  <div id="aviso">⚠️ Movimento histórico, sem previsão de comportamento futuro.</div>
</div>

<div id="ranking-panel">
  <span id="voltar-grafico" onclick="fecharRanking()">← Voltar ao gráfico</span>
  <div id="ranking-texto">Carregando...</div>
</div>

<script>
let chart = null;
let areaSeries = null;
let tickerAtual = null;
let periodoAtual = '1mo';
let intervaloContador = null;
let segundosRestantes = 60;

async function verGrafico(){
    let ticker = document.getElementById('ticker-input').value.trim();
    if (!ticker) return;
    periodoAtual = '1mo';
    marcarBotaoAtivo('1mo');
    await carregarGrafico(ticker, periodoAtual);
}

function trocarPeriodo(periodo) {
    if (!tickerAtual) return;
    periodoAtual = periodo;
    marcarBotaoAtivo(periodo);
    carregarGrafico(tickerAtual, periodo);
}

function marcarBotaoAtivo(periodo) {
    document.querySelectorAll('#grafico-periodos button').forEach((b) => b.classList.remove('ativo'));
    const mapa = { '5d': 'btn-5d', '1mo': 'btn-1mo', '6mo': 'btn-6mo', '1a': 'btn-1a', '5a': 'btn-5a' };
    const btn = document.getElementById(mapa[periodo]);
    if (btn) btn.classList.add('ativo');
}

async function carregarGrafico(ticker, periodo){
    pararContador();
    fecharRanking();

    const tickerUpper = ticker.toUpperCase();

    // Mostra o que já tem salvo localmente PRIMEIRO (instantâneo),
    // enquanto busca a versão atualizada por trás, em silêncio.
    const doCache = lerDoCache(tickerUpper, periodo);
    if (doCache) {
        document.getElementById('mensagem').style.display = 'none';
        tickerAtual = tickerUpper;
        periodoAtual = periodo;
        preencherCard(tickerAtual, doCache[doCache.length - 1].value, doCache[doCache.length - 2].value);
        document.getElementById('card').style.display = 'block';
        requestAnimationFrame(() => renderGrafico(doCache));
        iniciarContador();
    } else {
        document.getElementById('mensagem').style.display = 'block';
        document.getElementById('mensagem').innerText = 'Buscando ' + ticker + '...';
        document.getElementById('card').style.display = 'none';
    }

    try {
        let r = await fetch('/api/grafico?ticker=' + encodeURIComponent(ticker) + '&periodo=' + encodeURIComponent(periodo));
        let data = await r.json();

        if (data.dados && data.dados.length > 1) {
            document.getElementById('mensagem').style.display = 'none';
            tickerAtual = tickerUpper;
            periodoAtual = periodo;
            preencherCard(tickerAtual, data.dados[data.dados.length - 1].value, data.dados[data.dados.length - 2].value);
            document.getElementById('card').style.display = 'block';
            requestAnimationFrame(() => {
                renderGrafico(data.dados);
            });
            salvarNoCache(tickerAtual, periodo, data.dados);
            iniciarContador();
        } else if (!doCache) {
            document.getElementById('mensagem').innerText = data.texto || 'Erro ao gerar gráfico';
        }
    } catch (e) {
        if (!doCache) {
            document.getElementById('mensagem').innerText = 'Erro ao buscar gráfico: ' + e.message;
        }
    }
}

// --- Cache local (localStorage) — carregamento instantâneo ao reabrir ---
// Uma chave por ticker + período, para não misturar dados de janelas diferentes.

function chaveCache(ticker, periodo) {
    return 'nova_grafico_' + ticker + '_' + periodo;
}

function salvarNoCache(ticker, periodo, dados) {
    try {
        localStorage.setItem(chaveCache(ticker, periodo), JSON.stringify(dados));
    } catch (e) {
        // Se o localStorage estiver cheio/bloqueado, ignora silenciosamente —
        // a página continua funcionando normal, só sem cache.
    }
}

function lerDoCache(ticker, periodo) {
    try {
        const bruto = localStorage.getItem(chaveCache(ticker, periodo));
        return bruto ? JSON.parse(bruto) : null;
    } catch (e) {
        return null;
    }
}

function preencherCard(ticker, precoAtual, precoAnterior) {
    const variacaoAbs = precoAtual - precoAnterior;
    const variacaoPct = (variacaoAbs / precoAnterior) * 100;
    const subiu = variacaoAbs >= 0;

    document.getElementById('card-ticker').innerText = ticker;
    document.getElementById('card-preco').innerText = 'R$ ' + precoAtual.toFixed(2);

    const variacaoEl = document.getElementById('card-variacao');
    variacaoEl.innerText = (subiu ? '▲ +' : '▼ ') + variacaoPct.toFixed(2) + '%';
    variacaoEl.className = subiu ? 'up' : 'down';
}

function renderGrafico(dados) {
    const container = document.getElementById('chart-container');
    container.innerHTML = '';

    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 280,
        layout: {
            background: { color: '#161b22' },
            textColor: '#8b949e',
        },
        grid: {
            vertLines: { color: '#21262d' },
            horzLines: { color: '#21262d' },
        },
        rightPriceScale: { borderColor: '#30363d' },
        timeScale: { borderColor: '#30363d' },
        // Magnet: o crosshair "gruda" na linha em vez de flutuar livre —
        // é o que dá a sensação de "andar em cima do gráfico".
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Magnet,
            vertLine: { labelVisible: false },
            horzLine: { labelVisible: false },
        },
        handleScroll: {
            mouseWheel: true,
            pressedMouseMove: true,
            horzTouchDrag: true,
            vertTouchDrag: true,
        },
        handleScale: {
            axisPressedMouseMove: true,
            mouseWheel: true,
            pinch: true,
        },
    });

    areaSeries = chart.addAreaSeries({
        lineColor: '#1e88e5',
        topColor: 'rgba(30, 136, 229, 0.4)',
        bottomColor: 'rgba(30, 136, 229, 0.0)',
        lineWidth: 2,
    });

    areaSeries.setData(dados);
    chart.timeScale().fitContent();

    // Balão que segue o dedo, mostrando preço e data do ponto tocado
    chart.subscribeCrosshairMove((param) => {
        const tooltip = document.getElementById('tooltip');

        if (!param.time || !param.point || param.point.x < 0) {
            tooltip.style.display = 'none';
            return;
        }

        const ponto = param.seriesData.get(areaSeries);
        if (!ponto) {
            tooltip.style.display = 'none';
            return;
        }

        tooltip.style.display = 'block';
        tooltip.style.left = param.point.x + 'px';
        tooltip.style.top = param.point.y + 'px';
        tooltip.querySelector('.preco').innerText = 'R$ ' + ponto.value.toFixed(2);
        tooltip.querySelector('.data').innerText = formatarDataBR(param.time);
    });
}

function formatarDataBR(isoDate) {
    const [ano, mes, dia] = isoDate.split('-');
    return `${dia}/${mes}/${ano}`;
}

window.addEventListener('resize', () => {
    if (chart) {
        const container = document.getElementById('chart-container');
        chart.applyOptions({ width: container.clientWidth });
    }
});

document.getElementById('ticker-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verGrafico();
});

// --- Cronômetro + atualização "ao vivo" a cada 60s ---

function iniciarContador() {
    pararContador();
    segundosRestantes = 60;
    atualizarTextoContador();
    intervaloContador = setInterval(tickContador, 1000);
}

function pararContador() {
    if (intervaloContador) {
        clearInterval(intervaloContador);
        intervaloContador = null;
    }
}

function tickContador() {
    if (document.visibilityState !== 'visible') return;

    segundosRestantes -= 1;
    if (segundosRestantes <= 0) {
        atualizarPrecoAoVivo();
        segundosRestantes = 60;
    }
    atualizarTextoContador();
}

function atualizarTextoContador() {
    document.getElementById('contador').innerText = `atualiza em ${segundosRestantes}s`;
}

async function atualizarPrecoAoVivo() {
    if (!tickerAtual) return;

    try {
        const r = await fetch('/api/cotacao?ticker=' + encodeURIComponent(tickerAtual));
        const data = await r.json();
        if (!data.sucesso || !areaSeries) return;

        const hojeISO = new Date().toISOString().slice(0, 10);
        areaSeries.update({ time: hojeISO, value: data.preco });

        const precoAnteriorTexto = document.getElementById('card-preco').innerText.replace('R$', '').trim();
        const precoAnterior = parseFloat(precoAnteriorTexto.replace(',', '.'));
        preencherCard(tickerAtual, data.preco, isNaN(precoAnterior) ? data.preco : precoAnterior);

        const status = document.getElementById('status-live');
        status.classList.add('ativo');
        setTimeout(() => status.classList.remove('ativo'), 1500);
    } catch (e) {
        // Falha silenciosa — o cronômetro continua normal na próxima volta.
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && tickerAtual) {
        segundosRestantes = 60;
        atualizarTextoContador();
    }
});

// --- Ranking do dia ---
async function abrirRanking() {
    pararContador();
    document.getElementById('card').style.display = 'none';
    document.getElementById('mensagem').style.display = 'none';
    document.getElementById('ranking-panel').style.display = 'block';
    document.getElementById('ranking-texto').innerText = 'Buscando dados de mercado...';

    try {
        let r = await fetch('/api/investir');
        let data = await r.json();
        document.getElementById('ranking-texto').innerText = data.texto || 'Sem resposta.';
    } catch (e) {
        document.getElementById('ranking-texto').innerText = 'Erro ao buscar dados: ' + e.message;
    }
}

function fecharRanking() {
    document.getElementById('ranking-panel').style.display = 'none';
}

// Se o bot mandou um link tipo ?ticker=PETR4.SA, já abre com esse ticker
const params = new URLSearchParams(window.location.search);
const tickerDaURL = params.get('ticker');
if (tickerDaURL) {
    document.getElementById('ticker-input').value = tickerDaURL.toUpperCase();
}

verGrafico();
</script>

</body>
</html>
