<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Web</title>

<!-- lightweight-charts via CDN — sem build, sem npm install.
     Projeto é HTML/JS puro, então a biblioteca entra assim. -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
  body {
    background: #0d1117;
    color: #eee;
    font-family: sans-serif;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.8em;
  }
  button {
    background: #1e88e5;
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    font-size: 1.1em;
    border-radius: 8px;
    margin: 10px 0;
    cursor: pointer;
  }
  input {
    width: 100%;
    padding: 12px;
    font-size: 1.1em;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    box-sizing: border-box;
  }
  #saida {
    background: #1a1a1a;
    border-radius: 8px;
    padding: 14px;
    margin-top: 10px;
    white-space: pre-wrap;
    font-family: monospace;
  }

  /* --- Componente de gráfico (dark/slate) --- */
  #grafico-card {
    background: #161b22;
    border: 1px solid #2a2f38;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    display: none; /* aparece só depois de carregar dados */
  }
  #grafico-periodos {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  #grafico-periodos button {
    flex: 1;
    padding: 8px;
    font-size: 0.9em;
    margin: 0;
    background: #21262d;
    border: 1px solid #30363d;
    color: #8b949e;
  }
  #grafico-periodos button.ativo {
    background: #1e88e5;
    color: white;
    border-color: #1e88e5;
  }
  #grafico-periodos button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #chart-container {
    width: 100%;
    height: 320px;
    margin-top: 12px;
  }
  #grafico-aviso {
    font-size: 0.85em;
    color: #8b949e;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>NOVA._.📈 Web</h1>

<button onclick="rodarInvestir()">Rodar /investir</button>

<input id="ticker" type="text" placeholder="PETR4.SA" value="PETR4.SA">
<button onclick="verGrafico()">Ver Gráfico</button>

<div id="saida">Clique em um botão...</div>

<!-- Componente de gráfico interativo -->
<div id="grafico-card">
  <div id="grafico-periodos">
    <button disabled title="Em breve">1D</button>
    <button class="ativo" id="btn-1m">1M</button>
    <button disabled title="Em breve">1A</button>
  </div>
  <div id="chart-container"></div>
  <div id="grafico-aviso">⚠️ Movimento histórico, sem previsão de comportamento futuro.</div>
</div>

<script>
let chart = null;
let areaSeries = null;

async function rodarInvestir(){
    document.getElementById('saida').innerText = 'Buscando dados de mercado...';
    document.getElementById('grafico-card').style.display = 'none';
    try {
        let r = await fetch('/api/investir');
        let data = await r.json();
        document.getElementById('saida').innerText = data.texto || 'Sem resposta.';
    } catch (e) {
        document.getElementById('saida').innerText = 'Erro ao buscar dados: ' + e.message;
    }
}

async function verGrafico(){
    let ticker = document.getElementById('ticker').value;
    document.getElementById('saida').innerText = 'Buscando ' + ticker + '...';
    document.getElementById('grafico-card').style.display = 'none';

    try {
        let r = await fetch('/api/grafico?ticker=' + ticker);
        let data = await r.json();

        if (data.dados && data.dados.length > 0) {
            document.getElementById('saida').innerText = data.texto;
            renderGrafico(data.dados);
            document.getElementById('grafico-card').style.display = 'block';
        } else {
            document.getElementById('saida').innerText = data.texto || 'Erro ao gerar gráfico';
        }
    } catch (e) {
        document.getElementById('saida').innerText = 'Erro ao buscar gráfico: ' + e.message;
    }
}

/**
 * Desenha (ou redesenha) o gráfico de área usando lightweight-charts,
 * com estilo dark/slate e sombra azul.
 * @param {Array<{time: string, value: number}>} dados
 */
function renderGrafico(dados) {
    const container = document.getElementById('chart-container');
    container.innerHTML = ''; // limpa gráfico anterior, se houver

    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 320,
        layout: {
            background: { color: '#161b22' },
            textColor: '#8b949e',
        },
        grid: {
            vertLines: { color: '#21262d' },
            horzLines: { color: '#21262d' },
        },
        rightPriceScale: {
            borderColor: '#30363d',
        },
        timeScale: {
            borderColor: '#30363d',
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
        },
    });

    areaSeries = chart.addAreaSeries({
        lineColor: '#1e88e5',
        topColor: 'rgba(30, 136, 229, 0.4)',
        bottomColor: 'rgba(30, 136, 229, 0.0)',
        lineWidth: 2,
    });

    areaSeries.setData(dados);
    chart.timeScale().fitContent();
}

// Redimensiona o gráfico se a tela mudar de tamanho (responsivo)
window.addEventListener('resize', () => {
    if (chart) {
        const container = document.getElementById('chart-container');
        chart.applyOptions({ width: container.clientWidth });
    }
});
</script>

</body>
</html>
