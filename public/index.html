<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #eee;
    font-family: -apple-system, sans-serif;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Barra superior: busca + link discreto pro ranking */
  #topo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  #ticker-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1em;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #eee;
  }
  #btn-buscar {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #8b949e;
    font-size: 1.1em;
    cursor: pointer;
  }
  #link-ranking {
    text-align: right;
    font-size: 0.85em;
    color: #58a6ff;
    margin-bottom: 12px;
    cursor: pointer;
  }

  /* Cartão do ativo */
  #card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 18px;
    display: none;
  }
  #card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  #card-ticker {
    font-size: 1.3em;
    font-weight: 700;
  }
  #card-preco {
    font-size: 1.5em;
    font-weight: 700;
    text-align: right;
  }
  #card-variacao {
    text-align: right;
    font-size: 0.95em;
    margin-top: 2px;
  }
  .up { color: #3fb950; }
  .down { color: #f85149; }

  #chart-container {
    width: 100%;
    height: 280px;
    margin-top: 14px;
  }

  #grafico-periodos {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  #grafico-periodos button {
    flex: 1;
    padding: 8px 0;
    font-size: 0.85em;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #8b949e;
    cursor: pointer;
  }
  #grafico-periodos button.ativo {
    background: #1e88e5;
    color: white;
    border-color: #1e88e5;
  }
  #grafico-periodos button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  #aviso {
    font-size: 0.78em;
    color: #6e7681;
    margin-top: 12px;
    text-align: center;
  }

  #mensagem {
    text-align: center;
    color: #6e7681;
    padding: 40px 0;
  }

  /* Painel do ranking do dia (escondido por padrão) */
  #ranking-panel {
    display: none;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 18px;
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 0.9em;
  }
  #voltar-grafico {
    color: #58a6ff;
    cursor: pointer;
    font-size: 0.85em;
    margin-bottom: 10px;
    display: inline-block;
  }
</style>
</head>
<body>

<div id="topo">
  <input id="ticker-input" type="text" placeholder="Digite um ticker (ex: PETR4.SA)" value="PETR4.SA">
  <button id="btn-buscar" onclick="verGrafico()">🔍</button>
</div>

<div id="link-ranking" onclick="abrirRanking()">📊 Ranking do dia</div>

<div id="mensagem">Digite um ticker e busque para ver o gráfico.</div>

<div id="card">
  <div id="card-header">
    <div id="card-ticker"></div>
    <div>
      <div id="card-preco"></div>
      <div id="card-variacao"></div>
    </div>
  </div>

  <div id="chart-container"></div>

  <div id="grafico-periodos">
    <button disabled title="Em breve">1D</button>
    <button disabled title="Em breve">5D</button>
    <button class="ativo">1M</button>
    <button disabled title="Em breve">6M</button>
    <button disabled title="Em breve">1A</button>
  </div>

  <div id="aviso">⚠️ Movimento histórico, sem previsão de comportamento futuro.</div>
</div>

<div id="ranking-panel">
  <span id="voltar-grafico" onclick="fecharRanking()">← Voltar ao gráfico</span>
  <div id="ranking-texto">Carregando...</div>
</div>

<script>
let chart = null;
let areaSeries = null;

async function verGrafico(){
    let ticker = document.getElementById('ticker-input').value.trim();
    if (!ticker) return;

    fecharRanking();
    document.getElementById('mensagem').style.display = 'block';
    document.getElementById('mensagem').innerText = 'Buscando ' + ticker + '...';
    document.getElementById('card').style.display = 'none';

    try {
        let r = await fetch('/api/grafico?ticker=' + encodeURIComponent(ticker));
        let data = await r.json();

        if (data.dados && data.dados.length > 1) {
            document.getElementById('mensagem').style.display = 'none';
            preencherCard(ticker, data.dados);
            renderGrafico(data.dados);
            document.getElementById('card').style.display = 'block';
        } else {
            document.getElementById('mensagem').innerText = data.texto || 'Erro ao gerar gráfico';
        }
    } catch (e) {
        document.getElementById('mensagem').innerText = 'Erro ao buscar gráfico: ' + e.message;
    }
}

function preencherCard(ticker, dados) {
    const ultimo = dados[dados.length - 1].value;
    const anterior = dados[dados.length - 2].value;
    const variacaoAbs = ultimo - anterior;
    const variacaoPct = (variacaoAbs / anterior) * 100;
    const subiu = variacaoAbs >= 0;

    document.getElementById('card-ticker').innerText = ticker.toUpperCase();
    document.getElementById('card-preco').innerText = 'R$ ' + ultimo.toFixed(2);

    const variacaoEl = document.getElementById('card-variacao');
    variacaoEl.innerText = (subiu ? '▲ +' : '▼ ') + variacaoPct.toFixed(2) + '%';
    variacaoEl.className = subiu ? 'up' : 'down';
}

function renderGrafico(dados) {
    const container = document.getElementById('chart-container');
    container.innerHTML = '';

    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 280,
        layout: {
            background: { color: '#161b22' },
            textColor: '#8b949e',
        },
        grid: {
            vertLines: { color: '#21262d' },
            horzLines: { color: '#21262d' },
        },
        rightPriceScale: { borderColor: '#30363d' },
        timeScale: { borderColor: '#30363d' },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });

    areaSeries = chart.addAreaSeries({
        lineColor: '#1e88e5',
        topColor: 'rgba(30, 136, 229, 0.4)',
        bottomColor: 'rgba(30, 136, 229, 0.0)',
        lineWidth: 2,
    });

    areaSeries.setData(dados);
    chart.timeScale().fitContent();
}

window.addEventListener('resize', () => {
    if (chart) {
        const container = document.getElementById('chart-container');
        chart.applyOptions({ width: container.clientWidth });
    }
});

// Busca automaticamente ao apertar Enter no campo
document.getElementById('ticker-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verGrafico();
});

// --- Ranking do dia (escondido atrás do link discreto) ---
async function abrirRanking() {
    document.getElementById('card').style.display = 'none';
    document.getElementById('mensagem').style.display = 'none';
    document.getElementById('ranking-panel').style.display = 'block';
    document.getElementById('ranking-texto').innerText = 'Buscando dados de mercado...';

    try {
        let r = await fetch('/api/investir');
        let data = await r.json();
        document.getElementById('ranking-texto').innerText = data.texto || 'Sem resposta.';
    } catch (e) {
        document.getElementById('ranking-texto').innerText = 'Erro ao buscar dados: ' + e.message;
    }
}

function fecharRanking() {
    document.getElementById('ranking-panel').style.display = 'none';
}

// Carrega o gráfico do ticker padrão ao abrir a página
verGrafico();
</script>

</body>
</html>
